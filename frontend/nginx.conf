server {
  listen 8603;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  set $app_base_path "${APP_BASE_PATH}";
  absolute_redirect off;

  client_max_body_size 200m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml;
  gzip_min_length 256;

  # --- Phoenix UI & API ---

  location = ${APP_BASE_PATH}phoenix {
    return 302 ${APP_BASE_PATH}phoenix/;
  }

  location ^~ ${APP_BASE_PATH}phoenix/assets/ {
    rewrite ^${APP_BASE_PATH}phoenix/assets/(.*)$ /assets/$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_pass ${PHOENIX_URL};
  }

  location = ${APP_BASE_PATH}phoenix/api {
    rewrite ^${APP_BASE_PATH}phoenix/api$ /api break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_pass ${PHOENIX_URL};
  }

  location ^~ ${APP_BASE_PATH}phoenix/api/ {
    rewrite ^${APP_BASE_PATH}phoenix/api(.*)$ /api$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_pass ${PHOENIX_URL};
  }

  location ^~ ${APP_BASE_PATH}phoenix/v1/ {
    rewrite ^${APP_BASE_PATH}phoenix/v1(.*)$ /v1$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_pass ${PHOENIX_URL};
  }

  location = ${APP_BASE_PATH}phoenix/graphql {
    rewrite ^${APP_BASE_PATH}phoenix/graphql$ /graphql break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_pass ${PHOENIX_URL};
  }

  location = ${APP_BASE_PATH}phoenix/modernizr.js {
    rewrite ^${APP_BASE_PATH}phoenix/modernizr\.js$ /modernizr.js break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_pass ${PHOENIX_URL};
  }

  location = ${APP_BASE_PATH}phoenix/favicon.ico {
    rewrite ^${APP_BASE_PATH}phoenix/favicon\.ico$ /favicon.ico break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_pass ${PHOENIX_URL};
  }

  location ^~ ${APP_BASE_PATH}phoenix/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_pass ${PHOENIX_URL};
  }

  location = ${APP_BASE_PATH}api {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_pass ${PHOENIX_URL};
  }

  location ^~ ${APP_BASE_PATH}api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_pass ${PHOENIX_URL};
  }

  location ^~ ${APP_BASE_PATH}v1/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_pass ${PHOENIX_URL};
  }

  location = ${APP_BASE_PATH}graphql {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_pass ${PHOENIX_URL};
  }

  # --- Backend API ---

  location ^~ ${APP_BASE_PATH}auth/ {
    rewrite ^${APP_BASE_PATH}(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass ${BACKEND_URL};
  }

  location ^~ ${APP_BASE_PATH}admin/ {
    rewrite ^${APP_BASE_PATH}(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass ${BACKEND_URL};
  }

  location ^~ ${APP_BASE_PATH}db-connections {
    rewrite ^${APP_BASE_PATH}(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass ${BACKEND_URL};
  }

  location ^~ ${APP_BASE_PATH}sessions {
    rewrite ^${APP_BASE_PATH}(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass ${BACKEND_URL};
  }

  location ^~ ${APP_BASE_PATH}runtime/ {
    rewrite ^${APP_BASE_PATH}(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass ${BACKEND_URL};
  }

  location ^~ ${APP_BASE_PATH}observability/ {
    rewrite ^${APP_BASE_PATH}(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass ${BACKEND_URL};
  }

  location = ${APP_BASE_PATH}health {
    rewrite ^${APP_BASE_PATH}(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_pass ${BACKEND_URL};
  }

  # --- Static assets ---

  location ^~ ${APP_BASE_PATH}assets/ {
    rewrite ^${APP_BASE_PATH}(.*)$ /$1 break;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location ~ ^${APP_BASE_PATH}?$ {
    if ($app_base_path != "/") {
      return 302 ${APP_BASE_PATH};
    }
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }

  location ^~ ${APP_BASE_PATH} {
    rewrite ^${APP_BASE_PATH}(.*)$ /$1 break;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
