  # ─── Postgres (test / examples datasets) ───────────────────────────────────
  # Loads examples/*/dataset.csv into schema `examples` on first data volume init.
  # From host: localhost:${POSTGRES_EXAMPLES_PORT:-5433}
  # From backend container (same compose): host postgres_examples, port 5432, db examples.
  postgres_examples:
    image: postgres:16-alpine
    container_name: llm-analyst-postgres-examples
    environment:
      POSTGRES_USER: ${POSTGRES_EXAMPLES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_EXAMPLES_PASSWORD:-analyst}
      POSTGRES_DB: ${POSTGRES_EXAMPLES_DB:-examples}
    ports:
      - "${POSTGRES_EXAMPLES_PORT:-5433}:5432"
    volumes:
      - postgres_examples_data:/var/lib/postgresql/data
      - ./examples:/examples:ro
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_EXAMPLES_USER:-analyst} -d ${POSTGRES_EXAMPLES_DB:-examples}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─── Backend ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: llm-analyst-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: llm-analyst-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    image: llm-data-analyst-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        USE_MIRROR: ${USE_MIRROR}
        MIRROR_PIP_INDEX_URL: ${PIP_INDEX_URL}
        MIRROR_PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL}
        MIRROR_PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST}
    ports:
      - "${BACKEND_PORT:-9605}:8000"
    volumes:
      - ./backend_storage:/app/backend_storage
    env_file:
      - .env
    environment:
      # Search: env_file may omit SEARCH_*; defaults target search_service in this compose file
      - SSL_CERT_FILE=
      - REQUESTS_CA_BUNDLE=
      - CURL_CA_BUNDLE=
      - SEARCH_ENABLED=${SEARCH_ENABLED:-true}
      - SEARCH_BACKEND_URL=${SEARCH_BACKEND_URL:-http://search_service:8000}
      - SEARCH_ENDPOINT=${SEARCH_ENDPOINT:-/api/v1/search/}
      - SEARCH_FETCH_ENDPOINT=${SEARCH_FETCH_ENDPOINT:-/api/v1/fetch/}
      - SEARCH_TIMEOUT_SEC=${SEARCH_TIMEOUT_SEC:-20}
      - SEARCH_MAX_RESULTS_DEFAULT=${SEARCH_MAX_RESULTS_DEFAULT:-5}
      - SEARCH_FETCH_TOP_N_DEFAULT=${SEARCH_FETCH_TOP_N_DEFAULT:-3}
      - SEARCH_SOURCE_LABEL=${SEARCH_SOURCE_LABEL:-Search}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - BACKEND_SESSION_TTL_DAYS=${BACKEND_SESSION_TTL_DAYS:-7}
      - BACKEND_MAX_DATASET_MB=${BACKEND_MAX_DATASET_MB:-100}
      - BACKEND_STORAGE_DIR=${BACKEND_STORAGE_DIR_DOCKER:-/app/backend_storage}
      - AUTH_DB_PATH=${AUTH_DB_PATH_DOCKER:-/app/backend_storage/app.db}
      - AUTH_TOKEN_TTL_DAYS=${AUTH_TOKEN_TTL_DAYS:-30}
      - AUTH_DEFAULT_ADMIN_USERNAME=${AUTH_DEFAULT_ADMIN_USERNAME:-admin}
      - AUTH_DEFAULT_ADMIN_PASSWORD=${AUTH_DEFAULT_ADMIN_PASSWORD:-tdapadmin}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SEMANTIC_LAYER_ENABLED=${SEMANTIC_LAYER_ENABLED:-true}
      - SEMANTIC_PROFILE_MAX_TABLES=${SEMANTIC_PROFILE_MAX_TABLES:-100}
      - SEMANTIC_PROFILE_MAX_COLUMNS_PER_TABLE=${SEMANTIC_PROFILE_MAX_COLUMNS_PER_TABLE:-200}
      - SEMANTIC_PROFILE_SAMPLE_ROWS=${SEMANTIC_PROFILE_SAMPLE_ROWS:-1000}
      - SEMANTIC_PROFILE_TOP_VALUES=${SEMANTIC_PROFILE_TOP_VALUES:-20}
      - SEMANTIC_PROFILE_TIMEOUT_SEC=${SEMANTIC_PROFILE_TIMEOUT_SEC:-60}
      - SEMANTIC_CATALOG_STORE=${SEMANTIC_CATALOG_STORE:-postgres}
      - SEMANTIC_CATALOG_POSTGRES_DSN=${SEMANTIC_CATALOG_POSTGRES_DSN:-postgresql://analyst:analyst@postgres_examples:5432/examples}
      - SEMANTIC_VECTOR_ENABLED=${SEMANTIC_VECTOR_ENABLED:-true}
      - SEMANTIC_QDRANT_URL=${SEMANTIC_QDRANT_URL:-http://qdrant:6333}
      - SEMANTIC_QDRANT_API_KEY=${SEMANTIC_QDRANT_API_KEY:-}
      - SEMANTIC_QDRANT_COLLECTION=${SEMANTIC_QDRANT_COLLECTION:-semantic_catalog_chunks}
      - SEMANTIC_EMBEDDING_PROVIDER=${SEMANTIC_EMBEDDING_PROVIDER:-local}
      - PHOENIX_ENABLED=${PHOENIX_ENABLED:-true}
      - PHOENIX_PROJECT_NAME=${PHOENIX_PROJECT_NAME:-llm-data-analyst}
      # Backend шлёт трейсы в Phoenix по внутренней сети; в контейнере Phoenix всегда порт 6006 (не PHOENIX_UI_PORT с хоста)
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - PHOENIX_AUTO_INSTRUMENT=${PHOENIX_AUTO_INSTRUMENT:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres_examples:
        condition: service_healthy
      qdrant:
        condition: service_started
      phoenix:
        condition: service_healthy
      #search_service:
      #  condition: service_healthy
    restart: unless-stopped

  frontend:
    image: llm-data-analyst-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        USE_MIRROR: ${USE_MIRROR}
        NPM_REGISTRY: ${NPM_REGISTRY}
        APP_BASE_PATH: ${APP_BASE_PATH:-/}
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
      - PHOENIX_URL=${PHOENIX_URL:-http://phoenix:6006}
      - APP_BASE_PATH=${APP_BASE_PATH:-/}
    ports:
      - "${FRONTEND_PORT:-9603}:8603"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8603/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      phoenix:
        condition: service_healthy
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-10.13.2
    ports:
      - "${PHOENIX_UI_PORT:-9607}:6006"
      - "${PHOENIX_GRPC_PORT:-9608}:4317"
    environment:
      - PHOENIX_WORKING_DIR=${PHOENIX_WORKING_DIR:-/mnt/data}
      - PHOENIX_HOST_ROOT_PATH=${PHOENIX_HOST_ROOT_PATH:-/phoenix}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - phoenix_data:/mnt/data
    restart: unless-stopped

volumes:
  phoenix_data:
  postgres_examples_data:
  qdrant_data:
  redis_data:
