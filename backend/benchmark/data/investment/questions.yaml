cases:
  - id: portfolio_structure
    question: "Опиши структуру портфеля: по типам инструментов, счетам, тикерам и риск-профилю."
    must_include_numbers:
      - 100
      - 71
      - 29
      - 41.71
      - 30.61
      - 27.68
      - 63
      - 19
      - 18
    expected_facts:
      - "Общая стоимость портфеля: 100,00 млн руб., 44 лота."
      - "Акции: 71,00 млн руб. и 71,00% портфеля; облигации: 29,00 млн руб. и 29,00%."
      - "По счетам: ИИС 41,71%, пенсионный 30,61%, брокерский 27,68%."
      - "По риску: средний 63,00%, высокий 19,00%, низкий 18,00%."
      - "Крупнейший тикер: NREH / НордРесурс Энерджи, 22,50 млн руб. и 22,50%."
    expected_insights:
      - "Портфель концентрирован в энергетике и в среднем риск-профиле."
      - "Нужно разделять акции и облигации, а не смешивать их в один список."

  - id: concentration_and_risk
    question: "Где в портфеле есть концентрация или перегруз по риску?"
    must_include_numbers:
      - 22.5
      - 63
      - 19
      - 12
      - 7
    expected_facts:
      - "NREH / НордРесурс Энерджи — крупнейшая позиция: 22,50% портфеля."
      - "Средний риск занимает 63,00% портфеля."
      - "Высокий риск занимает 19,00% портфеля."
      - "BRIZ / Бриз Ойл акция занимает 12,00%; BRIZ27 / Бриз Ойл БО-27 занимает 7,00%."
    expected_insights:
      - "Главная концентрация — NREH и общий перекос в средний риск."
      - "Высокий риск сконцентрирован в бумагах Бриз Ойл."

  - id: value_and_unrealized_pnl
    question: "Какие позиции дают наибольший вклад в стоимость портфеля и в нереализованный результат?"
    must_include_numbers:
      - 22.5
      - 12
      - 10
      - 0.83
      - -0.68
      - -0.41
    expected_facts:
      - "Топ по стоимости: NREH 22,50 млн руб., BRIZ 12,00 млн руб., NREH27 12,00 млн руб., KEDR 10,00 млн руб."
      - "Наибольший положительный вклад в нереализованный результат: NREH около +0,83 млн руб., KEDR около +0,54 млн руб."
      - "Наибольший отрицательный вклад: SOLN около -0,68 млн руб., TERA около -0,41 млн руб."
    expected_insights:
      - "Стоимость позиции и вклад в PnL — разные метрики."
      - "SOLN выглядит главным источником просадки, несмотря на вес 5%."

  - id: defensive_and_risky_positions
    question: "Какие позиции выглядят защитными, а какие — рисковыми?"
    must_include_numbers:
      - 10
      - 6
      - 2
      - 12
      - 7
      - 18.1
    expected_facts:
      - "Низкий риск: KEDR 10,00%, STEL 6,00%, STEL28 2,00%."
      - "Высокий риск: BRIZ 12,00%, BRIZ27 7,00%."
      - "BRIZ27 имеет доходность 18,10%, но относится к высокому риску."
      - "STEL28 — облигация низкого риска с доходностью 13,44%."
    expected_insights:
      - "Защитную часть логично строить вокруг низкорисковых бумаг и облигаций."
      - "Высокая доходность BRIZ27 не делает позицию защитной из-за высокого риска."

  - id: management_note
    question: "Сформируй управленческую записку по итогам анализа."
    expected_facts:
      - "Портфель равен 100,00 млн руб."
      - "Акции занимают 71%, облигации 29%."
      - "NREH — крупнейшая позиция с весом 22,50%."
      - "Средний риск занимает 63%, высокий риск 19%, низкий риск 18%."
    expected_insights:
      - "Записка должна содержать выводы о концентрации, риске, защитной части и проблемных позициях."
      - "Не нужно выдавать инвестиционную рекомендацию как гарантированный прогноз."
