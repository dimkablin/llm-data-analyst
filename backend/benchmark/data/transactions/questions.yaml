  expected_facts:
  - 'Moscow: 683 операции, amount 6 898 194, bank_income 7 811, suspicious_count 16, suspicious_rate_pct 2,34%.'
  - 'Saint Petersburg: 433 операции, amount 4 192 239, bank_income 12 033, suspicious_count 6, suspicious_rate_pct 1,39%.'
  - 'Yekaterinburg: 218 операций, amount 1 547 390, bank_income 13 015, suspicious_count 3, suspicious_rate_pct 1,38%.'
