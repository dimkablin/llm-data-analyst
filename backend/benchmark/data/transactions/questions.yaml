  - 7
  - 497588
  - 0
  expected_facts:
  - 'TRAVEL5: 55 операций, amount 2 227 032, cashback_amount 109 972, bank_income -74 781.'
  - 'no_promo: 1530 операций, amount 13 990 840, cashback_amount 17 590, bank_income 123 761.'
  - 'EVERYDAY2: 146 операций, amount 314 634, cashback_amount 6 237, bank_income -3 742.'
  - 'WELCOME3: 34 операции, amount 121 862, cashback_amount 3 563, bank_income -1 815.'
