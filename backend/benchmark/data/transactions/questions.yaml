  - Единственный месяц с отрицательным bank_income - апрель 2026.
  - Провал апреля связан с резким ростом cashback_amount.
  - Причину нужно искать в travel/TRAVEL5, а не во всех месяцах равномерно.
- id: promo_effectiveness
  question: 'Оцени экономику промо-акций: сравни их по числу операций, обороту, кэшбэку и доходу банка. Какие промо прибыльны, а какие съедают доход?'
