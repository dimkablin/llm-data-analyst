  - 3664086
  - 34959
  expected_facts:
  - '2026-01: 291 операций, amount 2 228 294, bank_income 18 267.'
  - '2026-02: 281 операция, amount 2 371 417, bank_income 17 198.'
  - '2026-03: 364 операции, amount 3 321 716, bank_income 24 011.'
  - '2026-04: 446 операций, amount 5 566 442, cashback_amount 115 060, bank_income -51 011.'
  - '2026-05: 390 операций, amount 3 664 086, bank_income 34 959.'
