  - TRAVEL5 - главный убыточный промо-драйвер.
  - no_promo формирует основной положительный bank_income.
  - EVERYDAY2 и WELCOME3 небольшие, но также минусовые.
- id: city_profit_and_risk
  question: Сравни города по обороту, доходу банка и подозрительным операциям. Где лучшая экономика, а где выше риск?
  must_include_numbers:
  - 683
