  - Офлайн-канал масштабный и прибыльный, несмотря на абсолютное число жалоб.
- id: lenta_online_delivery_sla
  question: 'Оцени SLA онлайн-заказов: сколько опозданий, сколько заказов вовремя, какое среднее время доставки, выручка, логистика и маржа. Отдельно сравни EXPRESS60 с обычной доставкой без промо и с самовывозом.'
