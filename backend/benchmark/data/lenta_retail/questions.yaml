  expected_facts:
  - 'ready_food: 170 заказов, complaint_count 35, return_count 8, net_margin -19 000.'
  - 'fresh_fruit_veg: 330 заказов, complaint_count 31, return_count 5, net_margin 153 000.'
  - 'online_delivery: 210 заказов, complaint_count 43, return_count 9, net_margin -92 000.'
  - 'offline_store: 1470 заказов, complaint_count 68, return_count 14, net_margin 1 540 000.'
