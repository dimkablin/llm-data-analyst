  - -118000
  - 115
  - 21
  - 48.57
  - 26000
  - 50
  - 0
  - 25.0
  - 25000
  expected_facts:
  - 'online_delivery + EXPRESS60: 95 заказов, late_count 37, avg_delivery_minutes 56,02, net_margin -118 000.'
  - 'online_delivery + none: 115 заказов, late_count 21, avg_delivery_minutes 48,57, net_margin 26 000.'
  - 'online_pickup + PICKUP5: 50 заказов, late_count 0, avg_delivery_minutes 25,00, net_margin 25 000.'
