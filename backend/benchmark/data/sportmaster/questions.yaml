cases:
  - id: monthly_channel_dynamics
    question: "Покажи динамику продаж выручки и объёма «Спортмастер» по месяцам за 2024–2025 годы в разрезе каналов (оффлайн и онлайн)."
    must_include_numbers:
      - 2916722731.5
      - 3850260538.43
      - 2359724715.7
      - 3144296580.29
      - 560478
      - 728387
      - 480691
      - 631154
    expected_facts:
      - "В 2024 онлайн: объём 560 478, выручка 2 916 722 731,50."
      - "В 2024 оффлайн: объём 728 387, выручка 3 850 260 538,43."
      - "В 2025 онлайн: объём 480 691, выручка 2 359 724 715,70."
      - "В 2025 оффлайн: объём 631 154, выручка 3 144 296 580,29."
      - "Пик выручки обоих каналов приходится на 2024-12; минимум онлайн в 2025-01, минимум оффлайн в 2024-01."
    expected_insights:
      - "Оффлайн стабильно больше онлайн по объёму и выручке."
      - "В 2025 выручка и объём ниже 2024 из-за неполного года в датасете."

  - id: top_categories_revenue
    question: "Покажи топ-3 категории товаров по выручке."
    must_include_numbers:
      - 4663198776.37
      - 3976798003.97
      - 1839824288.16
    expected_facts:
      - "Топ-1 категория: Обувь, объём 795 270, выручка 4 663 198 776,37."
      - "Топ-2 категория: Туризм и отдых, объём 538 477, выручка 3 976 798 003,97."
      - "Топ-3 категория: Одежда, объём 581 820, выручка 1 839 824 288,16."
    expected_insights:
      - "Обувь лидирует по выручке с большим отрывом."
      - "Спортинвентарь не должен попадать в топ-3 по выручке."

  - id: shoes_popular_brands
    question: "Покажи самые популярные бренды в категории «Обувь»"
    must_include_numbers:
      - 144192
      - 138487
      - 137377
    expected_facts:
      - "В категории Обувь по объёму лидирует Nike: 144 192."
      - "Adidas занимает второе место: 138 487."
      - "Puma занимает третье место: 137 377."
    expected_insights:
      - "Популярность нужно считать по объёму продаж, а не только по выручке."

  - id: shoes_march_2024_drop
    question: "Почему продажи категории «Обувь» упали в марте 2024 года? Проверь динамику трафика, средней скидки и конверсии в покупку вокруг этого месяца."
    must_include_numbers:
      - 27599
      - 22956
      - 32951
      - 152256
      - 125526
      - 179971
    expected_facts:
      - "Объём Обуви: 2024-02 = 27 599, 2024-03 = 22 956, 2024-04 = 32 951."
      - "Выручка Обуви: 2024-02 = 166 126 972,52, 2024-03 = 138 146 940,30, 2024-04 = 199 396 477,09."
      - "Трафик Обуви: 2024-02 = 152 256, 2024-03 = 125 526, 2024-04 = 179 971."
      - "Средняя скидка и конверсия в марте не объясняют падение так сильно, как снижение трафика."
    expected_insights:
      - "Главный драйвер падения в марте 2024 — просадка трафика."
      - "В апреле метрики восстанавливаются вместе с трафиком и продажами."

  - id: promo_effectiveness_2024
    question: "Оцени эффективность промо: сравни в 2024 году средний объём продаж и конверсию по категориям между периодами «Нет акции» и любыми промоакциями (любое значение, отличное от «Нет акции»)."
    must_include_numbers:
      - 133.78
      - 485.28
      - 93.92
      - 365.14
      - 77.62
      - 305.62
      - 88.51
      - 331.84
    expected_facts:
      - "Обувь: средний объём 133,78 без акции и 485,28 с промо; средняя конверсия 19,84% и 19,60%."
      - "Одежда: средний объём 93,92 без акции и 365,14 с промо; средняя конверсия 19,60% и 19,72%."
      - "Спортинвентарь: средний объём 77,62 без акции и 305,62 с промо; средняя конверсия 19,62% и 19,62%."
      - "Туризм и отдых: средний объём 88,51 без акции и 331,84 с промо; средняя конверсия 19,46% и 19,67%."
    expected_insights:
      - "Промо сильно повышают средний объём продаж во всех категориях."
      - "Конверсия меняется слабо; эффект промо больше виден в объёме и выручке."

  - id: center_nike_shoes_forecast
    question: "Сделай прогноз по выручке по региону “Центр” по бренду Nike по категории Обувь на 6 месяцев"
    must_include_numbers:
      - 6500456.58
      - 5837357.71
      - 8908452.22
      - 9943759.28
    expected_facts:
      - "Исторический минимум для Центр + Nike + Обувь: 2024-03, выручка 5 460 740,22."
      - "Исторический максимум для Центр + Nike + Обувь: 2024-12, выручка 9 943 759,28."
      - "Последние месяцы истории: 2025-08 = 8 835 070,74, 2025-09 = 7 597 774,14, 2025-10 = 8 908 452,22."
    expected_insights:
      - "Ответ должен явно отделять исторические факты от прогноза."
      - "Прогноз должен быть построен по отфильтрованному ряду Центр + Nike + Обувь, а не по всему датасету."

  - id: center_nike_shoes_anomalies
    question: "Найди аномалии по выручке по региону “Центр” по бренду Nike по категории Обувь"
    must_include_numbers:
      - 5460740.22
      - 9943759.28
    expected_facts:
      - "Для Центр + Nike + Обувь минимум выручки: 2024-03 = 5 460 740,22."
      - "Для Центр + Nike + Обувь максимум выручки: 2024-12 = 9 943 759,28."
    expected_insights:
      - "Аномалии должны искаться на месячном ряду выбранного сегмента."
      - "Нужно объяснить возможную сезонность декабрьского пика и мартовской просадки."

  - id: management_note
    question: "Сформируй управленческую записку по итогам анализа"
    expected_facts:
      - "Обувь — крупнейшая категория по выручке."
      - "Оффлайн-канал больше онлайн-канала по объёму и выручке."
      - "Мартовская просадка Обуви в 2024 связана прежде всего с трафиком."
      - "Промо повышают объём продаж, но конверсия меняется слабо."
    expected_insights:
      - "Записка должна содержать выводы, риски и практические рекомендации."
      - "Не нужно выдумывать факты вне CSV."
