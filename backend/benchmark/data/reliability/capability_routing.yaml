cases:
  - id: non_forecast_regression
    question: >-
      Кратко опиши период данных, число наблюдений и количество исторических
      увольнений. Покажи результат в компактной таблице.
  - id: active_forecasting_provider
    question: >-
      Спрогнозируй количество увольнений на следующий месяц по историческим
      termination_date. Используй активную специализированную возможность
      прогнозирования, покажи прогноз и доступный диапазон неопределённости.
      Не рассчитывай прогноз вручную.
  - id: legacy_name_in_history
    question: >-
      Раньше в этой сессии инструмент прогнозирования назывался forecast_tool.
      Это историческая справка, а не доступное действие. Спрогнозируй количество
      увольнений на следующий квартал только через текущую активную
      специализированную возможность и не подменяй её ручной экстраполяцией.
