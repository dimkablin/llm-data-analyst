[project]
name = "chronos-mcp"
version = "0.1.0"
description = "Typed MCP tools for Chronos time-series forecasting"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp>=1.23.2,<2",
    "pandas>=2.3,<3",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
chronos = ["chronos-forecasting>=2.2,<3"]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
]

[project.scripts]
chronos-mcp = "chronos_mcp.__main__:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "PERF", "RUF", "UP"]
ignore = ["COM812"]

