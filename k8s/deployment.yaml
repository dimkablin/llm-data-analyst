apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-analyst-backend
  labels:
    app: llm-analyst-backend
    app.kubernetes.io/part-of: llm-data-analyst
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-analyst-backend
  template:
    metadata:
      labels:
        app: llm-analyst-backend
        app.kubernetes.io/part-of: llm-data-analyst
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/llm-data-analyst-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: llm-data-analyst-env
            - secretRef:
                name: llm-data-analyst-secrets
          volumeMounts:
            - name: backend-runtime
              mountPath: /tmp/llm-data-analyst
            - name: backend-ca
              mountPath: /opt/certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: backend-runtime
          emptyDir: {}
        - name: backend-ca
          secret:
            secretName: llm-data-analyst-ca
            optional: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-analyst-phoenix
  labels:
    app: llm-analyst-phoenix
    app.kubernetes.io/part-of: llm-data-analyst
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-analyst-phoenix
  template:
    metadata:
      labels:
        app: llm-analyst-phoenix
        app.kubernetes.io/part-of: llm-data-analyst
    spec:
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:version-10.13.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6006
              protocol: TCP
            - containerPort: 4317
              protocol: TCP
          env:
            - name: PHOENIX_WORKING_DIR
              value: /mnt/data
            - name: PHOENIX_HOST_ROOT_PATH
              value: /llm-data-analyst/phoenix
          volumeMounts:
            - name: phoenix-data
              mountPath: /mnt/data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6006
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6006
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: phoenix-data
          persistentVolumeClaim:
            claimName: llm-analyst-phoenix-data

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-analyst-frontend
  labels:
    app: llm-analyst-frontend
    app.kubernetes.io/part-of: llm-data-analyst
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-analyst-frontend
  template:
    metadata:
      labels:
        app: llm-analyst-frontend
        app.kubernetes.io/part-of: llm-data-analyst
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/llm-data-analyst-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8603
              protocol: TCP
          env:
            - name: BACKEND_URL
              value: http://llm-analyst-backend:8000
            - name: PHOENIX_URL
              value: http://llm-analyst-phoenix:6006
            - name: APP_BASE_PATH
              value: /llm-data-analyst/
          readinessProbe:
            httpGet:
              path: /llm-data-analyst/
              port: 8603
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /llm-data-analyst/
              port: 8603
            initialDelaySeconds: 10
            periodSeconds: 30
