[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "search-service"
version = "1.0.0"
description = "Lightweight SearXNG search bridge for llm-data-analyst"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
