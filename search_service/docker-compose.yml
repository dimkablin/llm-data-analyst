services:

  # ─── SearXNG metasearch engine ────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./configs/searxng_settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - search_net

  # ─── SearXNG MCP Bridge (HTTP) ────────────────────────────────────────────────
  # Converts SearXNG into an MCP server accessible over HTTP/SSE.
  # Other services (e.g. OpenWebUI) can connect to http://searxng-mcp:8001/mcp
  searxng-mcp:
    build:
      context: .
      dockerfile: mcp.Dockerfile
    container_name: searxng-mcp-server
    environment:
      - SEARXNG_URL=http://searxng:8080
      - HOST=0.0.0.0
      - PORT=8001
      - TRANSPORT=http
      - CORS_ORIGIN=*
    depends_on:
      searxng:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - search_net

  # ─── Search Service (FastAPI bridge) ─────────────────────────────────────────
  search_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: search-service
    environment:
      - SEARXNG_API_URL=http://searxng:8080
      - SEARXNG_MIN_SCORE=${SEARXNG_MIN_SCORE:-0.0}
      - SEARCH_TIMEOUT_SEC=${SEARCH_TIMEOUT_SEC:-20.0}
      - FETCH_TIMEOUT_SEC=${FETCH_TIMEOUT_SEC:-15.0}
      - SEARCH_FETCH_MAX_CHARS=${SEARCH_FETCH_MAX_CHARS:-10000}
    ports:
      - "${SEARCH_SERVICE_PORT:-8610}:8000"
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - search_net

networks:
  search_net:
    name: search_net
