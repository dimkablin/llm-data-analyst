[project]
name = "llm-data-analyst"
version = "0.2.0"
requires-python = ">=3.11,<3.12"

[tool.poetry]
name = "llm-data-analyst"
version = "0.2.0"
description = ""
authors = ["Kirill Tushin <KATushin@inno.tech>"]
readme = "README.md"
# package-mode = false

[tool.poetry.dependencies]
plotly = "^6.1.2"
pandas = "^2.3.0"
tabulate = "^0.9.0"
streamlit = "^1.46.0"
ydata-profiling = "^4.16.1"
streamlit-ydata-profiling = "^0.2.1"
langchain = ">=1.0.0,<2.0.0"
langchain-openai = ">=1.0.0,<2.0.0"
langgraph = ">=1.0.0,<2.0.0"
jinja2 = "^3.1.2"
python-dotenv = "^1.1.1"
markdown2 = "^2.5.3"
setuptools = "^80.9.0"
fastapi = "^0.116.1"
uvicorn = "^0.35.0"
python-multipart = "^0.0.20"
tqdm = "^4.67.1"
arize-phoenix-otel = ">=0.8,<1.0"
openinference-instrumentation-langchain = ">=0.1,<1.0"
cryptography = "^46.0.3"
psycopg = {version = "^3.2.12", extras = ["binary"]}
duckdb = "^1.5.1"


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
black = "^25.1.0"
isort = "^6.0.1"
pytest = "^9.0.2"
ruff = "^0.15.7"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
