[project]
name = "llm-data-analyst"
version = "0.2.0"
requires-python = ">=3.11,<3.12"

[tool.poetry]
name = "llm-data-analyst"
version = "0.2.0"
description = ""
authors = ["Kirill Tushin <KATushin@inno.tech>"]
readme = "README.md"
# package-mode = false

[tool.poetry.dependencies]
plotly = "^6.1.2"
pandas = "^2.3.0"
tabulate = "^0.9.0"
streamlit = "^1.46.0"
ydata-profiling = "^4.16.1"
streamlit-ydata-profiling = "^0.2.1"
langchain = ">=1.0.0,<2.0.0"
langchain-openai = ">=1.0.0,<2.0.0"
langchain-ollama = ">=1.1.0,<2.0.0"
langgraph = ">=1.0.0,<2.0.0"
jinja2 = "^3.1.2"
python-dotenv = "^1.1.1"
markdown2 = "^2.5.3"
setuptools = "^80.9.0"
fastapi = "^0.116.1"
uvicorn = "^0.35.0"
python-multipart = "^0.0.20"
tqdm = "^4.67.1"
arize-phoenix-otel = ">=0.8,<1.0"
openinference-instrumentation-langchain = ">=0.1,<1.0"
cryptography = "^46.0.3"
psycopg = {version = "^3.2.12", extras = ["binary"]}
duckdb = "^1.5.1"
pyyaml = "^6.0.3"


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
black = "^25.1.0"
isort = "^6.0.1"
pytest = "^9.0.2"
ruff = "^0.15.7"

[tool.ruff]
line-length = 110
exclude = [".backend_old", ".search_service", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "COM",      # trailing commas
    "PERF",     # performance
    "RUF",      # ruff-specific
    "N",        # pep8-naming
    "SLF",      # private member access
    "BLE",      # blind exception catch
    "FAST",     # fastapi
]
ignore = [
    # Docstrings — отдельная задача, слишком много мест
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D200", "D205", "D212", "D400", "D401", "D413",
    # Русский текст в строках — intentional
    "RUF001", "RUF002", "RUF003",
    # Широкие исключения в route-файлах — intentional, закрыто per-file
    "BLE001",
    # B008: Depends() в default-аргументах — стандарт FastAPI (FAST002 покрывает это)
    "B008",
    # Разное опциональное
    "COM812",   # trailing comma в однострочных — пусть formatter решает
    "N806",     # uppercase variable names — иногда нужно (df, SQL-алиасы)
]

[tool.ruff.lint.per-file-ignores]
# tests: assert и private-доступ нормальны, строки в тестах могут быть длинными
"tests/*" = ["SLF001", "E501"]
"backend/api/routes/*" = ["BLE001"]
# RUF012: Pydantic BaseTool fields look like mutable class attrs but aren't
"backend/tools/impl/*" = ["RUF012"]
# N803: setup() receives class references as args — uppercase names are intentional
"backend/api/routes/query.py" = ["N803"]
# E501: LLM prompt strings cannot be broken mid-sentence
"backend/agent/prompts.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["Depends", "Security", "Query", "Header", "Cookie", "Body", "Form", "File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
